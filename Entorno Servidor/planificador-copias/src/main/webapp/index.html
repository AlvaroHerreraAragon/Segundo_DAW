<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Planificador de copias de seguridad</title>
        <style>
            body{
                font-family:Arial,sans-serif;
                max-width:800px;
                margin:35px auto;
                padding:0 20px;
                line-height:1.5;
                color:#243847
            }
            h1{
                color:#193f59
            }
            fieldset{
                padding:18px;
                margin:20px 0;
                border:1px solid #a9bdcc
            }
            legend{
                font-weight:bold
            }
            label{
                display:block;
                margin:12px 0 5px
            }
            input,select,button{
                font:inherit;
                padding:8px
            }
            input[type=text]{
                width:300px;
                max-width:95%
            }
            input[type=number]{
                width:120px
            }
            label.casilla{
                display:flex;
                gap:9px;
                align-items:center
            }
            button{
                background:#193f59;
                color:white;
                border:0;
                padding:12px 18px;
                cursor:pointer
            }
            a{
                color:#193f59
            }
        </style>
    </head>
    <body>
        <h1>Planificador de copias de seguridad</h1>
        <p>Configura tus copias y calcula el almacenamiento, el tiempo y el precio mensual.</p>
        <p><a href="planes">Consultar planes disponibles</a></p>
        <!-- Formulario proporcionado en el examen. El procesamiento se realiza en el servidor. -->
        <form action="calcular" method="post" accept-charset="UTF-8">
            <fieldset><legend>Cliente y plan</legend>
                <label for="cliente">Cliente o empresa</label><input id="cliente" name="cliente" type="text" required placeholder="Empresa Sur">
                <label for="plan">Plan</label><select id="plan" name="plan" required><option value="">Selecciona un plan</option><option value="basico">Básico</option><option value="profesional">Profesional</option><option value="empresa">Empresa</option></select>
            </fieldset>
            <fieldset><legend>Configuración de las copias</legend>
                <label for="datosGb">Datos originales por copia (GB, de 1 a 500)</label><input id="datosGb" name="datosGb" type="number" min="1" max="500" step="1" required value="10">
                <label for="copiasDiarias">Copias diarias</label><select id="copiasDiarias" name="copiasDiarias" required><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
                <label for="dias">Días de conservación (de 1 a 30)</label><input id="dias" name="dias" type="number" min="1" max="30" step="1" required value="7">
                <label class="casilla"><input type="checkbox" name="cifrado" value="si"> Solicitar cifrado</label>
            </fieldset>
            <label class="casilla"><input type="checkbox" name="condiciones" value="aceptadas" required> Acepto las condiciones de la simulación</label>
            <p><button type="submit">Calcular configuración</button></p>
        </form>
    </body>
</html>
