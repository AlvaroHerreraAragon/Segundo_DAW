<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <title>Reserva de actividades</title>
</head>
<body>
  <h1>Reserva de actividades</h1>
  <form name="reserva" method="post" action="reserva">
    <p>
      <label for="actividad">Actividad</label>
      <select id="actividad" name="actividad" required="">
        <option value="">Selecciona una actividad</option>
        <option value="escalada">Escalada</option>
        <option value="tirolina">Tirolina</option>
        <option value="kayak">Kayak</option>
      </select>
    </p>
    <p>
      <label for="categoria">Categoría</label>
      <select id="categoria" name="categoria" required="">
        <option value="">Selecciona una categoría</option>
        <option value="junior">Júnior</option>
        <option value="general">General</option>
      </select>
    </p>
    <fieldset>
      <legend>Turno</legend>
      <label><input type="radio" name="turno" value="manana" required=""> Mañana</label>
      <label><input type="radio" name="turno" value="tarde"> Tarde</label>
    </fieldset>
    <p>
      <label for="participantes">Participantes</label>
      <select id="participantes" name="participantes" required="">
        <option value="">Selecciona el número de participantes</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </p>
    <p><label><input type="checkbox" name="material" value="si"> Añadir material extra</label></p>
    <p><label><input type="checkbox" name="condiciones" value="aceptadas" required=""> Acepto las condiciones</label></p>
    <button type="submit">Calcular reserva</button>
  </form>


</body></html>
