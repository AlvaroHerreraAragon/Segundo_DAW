<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de pedidos</title>

    <script>

        var url = "servidor.php";

        // Función que crea una fila de la tabla con los datos recibidos
        function Crea_Fila(aCol) {

            var fila = document.createElement("tr");
            var col; var cont;

            // Recorremos los valores del objeto recibido
            Object.values(aCol).forEach(function (valor) {

                // Creamos una celda para cada valor
                col = document.createElement("td");

                // Introducimos el valor dentro de la celda
                cont = document.createTextNode(valor);
                col.appendChild(cont);

                // Añadimos la celda a la fila
                fila.appendChild(col);
            });

            // Devolvemos la fila creada
            return fila;
        }

        // Función que rellena la tabla con los pedidos recibidos
        function LlenaTabla(aTabla, cuerpoTabla) {
            var fila, td, botonModificar, botonBorrar;

            // Vaciamos la tabla antes de introducir los nuevos datos
            cuerpoTabla.innerHTML = "";

            // Recorremos todos los pedidos recibidos
            aTabla.forEach(function (d) {

                // Creamos una fila con los datos de cada pedido
                fila = Crea_Fila(d);

                // Creamos la celda y el botón para modificar el pedido
                td = document.createElement("td");
                botonModificar = document.createElement("button");
                botonModificar.innerHTML = "Modificar";

                // Guardamos el ID del pedido en el botón
                botonModificar.dataset.idid = d.id;

                // Asignamos la función que se ejecutará al pulsar el botón
                botonModificar.onclick = editarPedido;

                td.appendChild(botonModificar);
                fila.appendChild(td);

                // Creamos la celda y el botón para borrar el pedido
                td = document.createElement("td");
                botonBorrar = document.createElement("button");
                botonBorrar.innerHTML = "Borrar";

                // Guardamos el ID del pedido en el botón
                botonBorrar.dataset.idid = d.id;

                // Asignamos la función que se ejecutará al pulsar el botón
                botonBorrar.onclick = borrarPedido;

                td.appendChild(botonBorrar);
                fila.appendChild(td);

                // Añadimos la fila completa al cuerpo de la tabla
                cuerpoTabla.appendChild(fila);
            });
        }

        // Función que solicita al servidor el listado de clientes
        function pedirClientes() {
            var p = {
                servicio: "clientes"
            };

            // Preparamos los parámetros de la petición
            var parametros = {
                method: "POST",
                body: JSON.stringify(p)
            }

            // Enviamos la petición y procesamos los datos recibidos
            fetch(url, parametros)
                .then(r => r.json())
                .then(datos => listadoClientes(datos))
                .catch(e => console.error('error al pedir los datos ', e));
        }

        // Función que introduce los clientes recibidos en el select
        function listadoClientes(datos) {
            var select = document.getElementById("cliente");

            // Vaciamos el select antes de introducir los clientes
            select.innerHTML = "";

            // Creamos la primera opción para indicar que se debe seleccionar un cliente
            var opcion = document.createElement("option");
            opcion.value = "-1";
            opcion.innerHTML = "Selecciona un cliente";
            select.appendChild(opcion);

            // Recorremos los clientes recibidos
            datos.forEach(function (c) {
                opcion = document.createElement("option");

                // Guardamos el ID del cliente como valor de la opción
                opcion.value = c.id;

                // Mostramos el nombre y la ciudad del cliente
                opcion.innerHTML = c.nombre + " - " + c.ciudad;

                select.appendChild(opcion);
            });
        }

        // Función que solicita los pedidos del cliente seleccionado
        function PedirPedido() {

            var p = {
                servicio: "pedidos",
                idCliente: document.getElementById("cliente").value
            }

            // Preparamos los parámetros de la petición
            var parametros = {
                method: "POST",
                body: JSON.stringify(p)
            }

            // Enviamos la petición y mostramos los pedidos recibidos
            fetch(url, parametros)
                .then(r => r.json())
                .then(datos => PintaDetalle(datos))
                .catch(e => console.error('error al pedir los datos ', e));
        }

        // Función que muestra los pedidos recibidos en la tabla
        function PintaDetalle(datos) {

            // Vaciamos el cuerpo de la tabla
            document.getElementById("filas_tabla").innerHTML = "";

            // Si no hay pedidos, terminamos la función
            if (datos.length == 0) return;

            // Rellenamos la tabla con los pedidos recibidos
            LlenaTabla(datos, document.getElementById("filas_tabla"));

            // Limpiamos el formulario después de actualizar la tabla
            Cancelar();
        }

        // Función que permite añadir un pedido nuevo o modificar uno existente
        function anadePedido() {

            // Obtenemos el ID del cliente seleccionado
            var idCliente = document.querySelector("#cliente").value;

            // Comprobamos que se haya seleccionado un cliente
            if (idCliente == -1) {
                alert("Debes seleccionar antes una factura");
                return;
            }

            // Recogemos los datos introducidos en el formulario
            var producto = document.querySelector("#producto").value;
            var cantidad = document.querySelector("#cantidad").value;
            var precio = document.querySelector("#precio").value;
            var fecha = document.querySelector("#fecha").value;

            // Comprobamos que todos los campos estén rellenos
            if ((producto == "") || (cantidad == "") || (precio == "") || fecha == "") {
                alert("Todos los campos son obligatorios");
                document.querySelector("#cantidad").focus();
                return;
            }

            // Creamos el objeto con los datos del pedido
            var p = {
                servicio: "anade",
                idCliente: idCliente,
                producto: producto,
                cantidad: cantidad,
                precio: precio,
                fecha: fecha,
            };

            // Comprobamos si estamos añadiendo un pedido o modificando uno existente
            if (this.dataset.idid == "-1") {

                // Si el ID es -1, enviamos el servicio para añadir un pedido
                p.servicio = "anade";

            } else {

                // Si tiene otro ID, enviamos el servicio para modificar ese pedido
                p.servicio = "modificar";
                p.id = this.dataset.idid;
            }

            // Preparamos los parámetros de la petición
            var parametros = {
                method: 'POST',
                body: JSON.stringify(p)
            };

            // Enviamos los datos al servidor
            fetch(url, parametros)
                .then(r => r.json())

                // Actualizamos la tabla con los pedidos recibidos
                .then(datos => PintaDetalle(datos))
                .catch(e => console.error('error al pedir los datos ', e));
        }

        // Función que solicita los datos de un pedido para poder modificarlo
        function editarPedido() {

            // Creamos el objeto con el servicio y el ID del pedido seleccionado
            var p = {
                servicio: "selPedidoID",
                id: this.dataset.idid,
            }

            // Preparamos los parámetros de la petición
            var parametros = {
                method: "POST",
                body: JSON.stringify(p)
            };

            // Enviamos la petición al servidor
            fetch(url, parametros)
                .then(r => r.json())

                // Enviamos los datos recibidos para rellenar el formulario
                .then(datos => PintaCampos(datos))
                .catch(e => console.error('error al pedir los datos ', e));
        }

        // Función que rellena el formulario con los datos del pedido seleccionado
        function PintaCampos(datos) {

            // Introducimos los datos recibidos en sus respectivos campos
            document.querySelector("#producto").value = datos.producto;
            document.querySelector("#cantidad").value = datos.cantidad;
            document.querySelector("#precio").value = datos.precio;
            document.querySelector("#fecha").value = datos.fecha;

            // Guardamos el ID del pedido en el botón del formulario
            var boton = document.querySelector("#btAnade");
            boton.dataset.idid = datos.id;

            // Cambiamos el texto del botón para indicar que estamos modificando
            boton.innerHTML = "Modificar pedido";
        }

        // Función que permite borrar un pedido seleccionado
        function borrarPedido() {

            // Creamos el objeto con el servicio, el ID del pedido y el ID del cliente
            var p = {
                servicio: "borra",
                id: this.dataset.idid,
                idCliente: document.querySelector("#cliente").value
            }

            // Preparamos los parámetros de la petición
            var parametros = {
                method: "POST",
                body: JSON.stringify(p)
            };

            // Pedimos confirmación antes de borrar el pedido
            if (confirm(`¿Estas seguro de borrar este pedido ? `))

                // Si se confirma, enviamos la petición al servidor
                fetch(url, parametros)
                    .then(r => r.json())

                    // Actualizamos la tabla con los pedidos recibidos
                    .then(datos => PintaDetalle(datos))
                    .catch(e => console.error('error al pedir los datos ', e));
        }

        // Función que limpia el formulario y restablece el botón a su estado inicial
        function Cancelar() {

            // Restauramos los valores iniciales de los campos
            document.querySelector("#producto").value = document.querySelector("#producto").defaultValue;
            document.querySelector("#cantidad").value = document.querySelector("#cantidad").defaultValue;
            document.querySelector("#precio").value = document.querySelector("#precio").defaultValue;
            document.querySelector("#fecha").value = document.querySelector("#fecha").defaultValue;

            // Restablecemos el ID a -1 para indicar que no estamos modificando ningún pedido
            var boton = document.querySelector("#btAnade");
            boton.dataset.idid = "-1";

            // Cambiamos el texto del botón a su estado inicial
            boton.innerHTML = "Añadir Pedido";
        }

        // Función que se ejecuta al cargar la página
        window.onload = function () {

            // Asignamos las funciones a los eventos correspondientes
            document.querySelector("#cliente").onchange = PedirPedido;
            document.querySelector("#btAnade").onclick = anadePedido;
            document.querySelector("#btCancelar").onclick = Cancelar;

            // Cargamos el listado de clientes al iniciar la página
            pedirClientes();
        }
    </script>

</head>

<body>

    <h1>Gestión de pedidos</h1>

    <label>Selecciona un cliente:</label>
    <select id="cliente">
        <option value="-1">Selecciona un cliente</option>
    </select>

    <h2>Pedidos del cliente</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Fecha</th>
                <th>Modificar</th>
                <th>Borrar</th>
            </tr>
        </thead>
        <tbody id="filas_tabla"></tbody>
    </table>

    <h2>Formulario de pedidos</h2>

    <form id="formPedido">
        <label>Producto:</label>
        <input type="text" id="producto">

        <label>Cantidad:</label>
        <input type="number" id="cantidad">

        <label>Precio:</label>
        <input type="number" step="0.01" id="precio">

        <label>Fecha:</label>
        <input type="date" id="fecha">

        <button type="button" id="btAnade" data-idid="-1">
            Añadir pedido
        </button>

        <button type="button" id="btCancelar">
            Cancelar
        </button>
    </form>

</body>

</html>
