<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>

<body>
    <p>Ejercicio 6</p>
    <img src="https://www.photopills.com/sites/default/files/articles/2021/2020-photopiller-del-ano.jpg"
        alt="Imagen ejercicio6" id="imagen">
    <div>
        <input type="text" id="cuadro1" placeholder="Ingrese alto" />
        <input type="text" id="cuadro2" placeholder="Ingrese ancho" />
        <input type="button" value="Cambiar tamaño" onclick="cambiar_tamano()" />
    </div>

    <script>
        //Cambiar el tamaño segun los valores de los cuadros
        function cambiar_tamano() {
            let tam1 = document.getElementById("cuadro1").value;
            let tam2 = document.getElementById("cuadro2").value;
            const imagen = document.getElementById("imagen");
            imagen.style.width = tam2;
            imagen.style.height = tam1;
        }
    </script>
</body>

</html>
