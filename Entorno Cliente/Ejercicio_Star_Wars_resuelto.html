<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API de Star Wars</title>
    <style type="text/css">
        .estilo_Tabla_1 {
            font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
            width: 70%;
            border-collapse: collapse;
        }

        .estilo_Tabla_1 td {
            font-size: 1em;
            border: 1px solid #98bf21;
            padding: 4px;
        }

        .estilo_Tabla_1 th {
            border: 1px solid #98bf21;
            font-size: 1.2em;
            padding: 5px;
            background-color: #A7C942;
            color: #ffffff;
        }

        .estilo_Tabla_1 tr td {
            color: #000000;
            background-color: #EAF2D3;
        }

        caption {
            caption-side: bottom;
            color: green;
        }

        #navegacion {
            margin-top: 15px;
        }

        #navegacion button {
            margin-right: 8px;
            padding: 6px 12px;
            cursor: pointer;
        }

        #estado {
            margin: 10px 0;
        }

        #datosPlaneta {
            margin-top: 20px;
            padding: 10px;
            width: 70%;
            background-color: #f3f7e9;
            border: 1px solid #98bf21;
        }

        .enlacePlaneta {
            color: #1459a6;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>

    <script type="text/javascript">
        // Página que se está mostrando actualmente.
        let paginaActual = 1;

        // Direcciones de las páginas anterior y siguiente que devuelve la API.
        let urlAnterior = null;
        let urlSiguiente = null;

        // Al cargar el HTML, pedimos la primera página de personajes.
        window.onload = function () {
            cargarPersonajes("https://swapi.dev/api/people/");
        };

        // Consulta la API y pinta los personajes recibidos.
        async function cargarPersonajes(url) {
            const cuerpo = document.getElementById("cuerpoPersonajes");
            const estado = document.getElementById("estado");

            estado.textContent = "Cargando personajes...";
            cuerpo.innerHTML = "";

            try {
                const respuesta = await fetch(url);

                if (!respuesta.ok) {
                    throw new Error("No se han podido obtener los personajes.");
                }

                const datos = await respuesta.json();

                urlAnterior = datos.previous;
                urlSiguiente = datos.next;

                // Actualizamos el número de página usando la URL consultada.
                const coincidencia = url.match(/[?&]page=(\d+)/);
                paginaActual = coincidencia ? Number(coincidencia[1]) : 1;

                // Creamos una fila por cada personaje.
                for (const personaje of datos.results) {
                    const fila = document.createElement("tr");

                    agregarCelda(fila, personaje.name);
                    agregarCelda(fila, personaje.height);
                    agregarCelda(fila, personaje.mass);
                    agregarCelda(fila, personaje.birth_year);
                    agregarCelda(fila, personaje.gender);

                    // Mostramos la URL del planeta tal cual y permitimos pulsarla.
                    const celdaPlaneta = document.createElement("td");
                    const enlace = document.createElement("a");
                    enlace.className = "enlacePlaneta";
                    enlace.href = "#";
                    enlace.textContent = personaje.homeworld;
                    enlace.addEventListener("click", function (evento) {
                        evento.preventDefault();
                        cargarPlaneta(personaje.homeworld);
                    });
                    celdaPlaneta.appendChild(enlace);
                    fila.appendChild(celdaPlaneta);

                    cuerpo.appendChild(fila);
                }

                estado.textContent = "Página " + paginaActual;
                document.getElementById("anterior").disabled = !urlAnterior;
                document.getElementById("siguiente").disabled = !urlSiguiente;
            } catch (error) {
                estado.textContent = "Error: " + error.message +
                    " Comprueba la conexión a Internet e inténtalo de nuevo.";
                document.getElementById("anterior").disabled = !urlAnterior;
                document.getElementById("siguiente").disabled = !urlSiguiente;
            }
        }

        // Añade una celda de texto a una fila de la tabla.
        function agregarCelda(fila, texto) {
            const celda = document.createElement("td");
            celda.textContent = texto;
            fila.appendChild(celda);
        }

        // Muestra los datos del planeta al pulsar su nombre.
        async function cargarPlaneta(url) {
            const contenedor = document.getElementById("datosPlaneta");
            contenedor.textContent = "Cargando datos del planeta...";

            try {
                const respuesta = await fetch(url);

                if (!respuesta.ok) {
                    throw new Error("No se han podido obtener los datos del planeta.");
                }

                const planeta = await respuesta.json();

                // Construimos el contenido sin insertar HTML recibido de la API.
                contenedor.innerHTML = "";
                const titulo = document.createElement("h3");
                titulo.textContent = "Datos del planeta: " + planeta.name;
                contenedor.appendChild(titulo);

                const lista = document.createElement("ul");
                const campos = [
                    ["Periodo de rotación", planeta.rotation_period],
                    ["Periodo orbital", planeta.orbital_period],
                    ["Diámetro", planeta.diameter],
                    ["Clima", planeta.climate],
                    ["Gravedad", planeta.gravity],
                    ["Terreno", planeta.terrain],
                    ["Agua en superficie", planeta.surface_water],
                    ["Población", planeta.population]
                ];

                for (const campo of campos) {
                    const elemento = document.createElement("li");
                    elemento.textContent = campo[0] + ": " + campo[1];
                    lista.appendChild(elemento);
                }

                contenedor.appendChild(lista);
            } catch (error) {
                contenedor.textContent = "Error al cargar el planeta: " + error.message;
            }
        }

        // Botón para consultar la página anterior.
        function paginaAnterior() {
            if (urlAnterior) {
                cargarPersonajes(urlAnterior);
            }
        }

        // Botón para consultar la página siguiente.
        function paginaSiguiente() {
            if (urlSiguiente) {
                cargarPersonajes(urlSiguiente);
            }
        }
    </script>
</head>

<body>
    <h3>Ejemplo de llamada a la API de STAR WARS</h3>
    <br>

    <div id="estado">Preparando la consulta...</div>

    <table id="personajes" class="estilo_Tabla_1">
        <caption>Personajes STAR WARS</caption>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Altura</th>
                <th>Peso</th>
                <th>Nacimiento</th>
                <th>Género</th>
                <th>Homeworld</th>
            </tr>
        </thead>
        <tbody id="cuerpoPersonajes"></tbody>
    </table>

    <div id="navegacion">
        <button id="anterior" onclick="paginaAnterior()" disabled>Anterior</button>
        <button id="siguiente" onclick="paginaSiguiente()" disabled>Siguiente</button>
    </div>

    <div id="datosPlaneta">Datos del planeta:</div>
</body>
</html>
