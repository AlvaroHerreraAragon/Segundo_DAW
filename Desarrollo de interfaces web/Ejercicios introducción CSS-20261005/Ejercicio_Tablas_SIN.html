<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Plantilla</title>
  <style type="text/css">
    #TablaPersonas {
      border-collapse: collapse;
      font-family: sans-serif;
    }

    #TablaPersonas th {
      background-color: #729d2a;
      color: white;
      padding: 8px 12px;
      text-align: left;
      font-weight: bold;
      border: 1px solid #729d2a;
    }

    #TablaPersonas td {
      padding: 6px 12px;
      border-bottom: 1px solid black;
      border-left: 1px solid black;
      border-top: 1px solid black;
      border-right: 1px solid black;
      color: #333333;
      background-color: rgb(242, 255, 169);
    }

    #TablaPersonas caption {
      caption-side: bottom;
      text-align: center;
      margin-top: 8px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>

<body>
  <h2>Ejercicio. Dar Formato a una tabla</h2>
  <table id="TablaPersonas">
    <caption>Personas ..... IMPORTANTES</caption>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellidos</th>
        <th>Edad</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>Sven Olof</td>
        <td>Joachim Palme</td>
        <td>86</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Giovanni</td>
        <td>Falcone</td>
        <td>73</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Paolo Emanuele</td>
        <td>Borsellino</td>
        <td>72</td>
      </tr>
      <tr>
        <td>4</td>
        <td>Salvador Guillermo</td>
        <td>Allende Gossens</td>
        <td>104</td>
      </tr>
    </tbody>
  </table>

</body>

</html>
